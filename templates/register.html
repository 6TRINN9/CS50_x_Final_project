{% extends "base.html" %}
{% block title %} Sign Up {% endblock %}
{% block content %}
    <div class="row justify-content-center">
        <div class="col-mb5">
            <div class="card bg-dark border-warning">
                <div class="card body">
                    <h3 class="text-warning mb-4"><i class="bi bi-person-plus"></i>Sign Up</h3>
                    <form method="POST" action="/auth/register">
                        <div class="mb-3">
                            <label class="form-label text-light">Name</label>
                            <input type="text" name="first_name" class="form-control bg-dark text-light border-secondary" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-light">Email</label>
                            <input type="email" name="email" class="form-control bg-dark text-light border-secondary" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-light">Password</label>
                            <input type="password" name="password" class="form-control bg-dark text-light border-secondary" minlength="6" required>
                        </div>
                        <button class="btn btn-warning w-100 fw-bold">Create account</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
